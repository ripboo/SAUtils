name: AML Mod Compiler

on:
  workflow_dispatch:
    inputs:
      mod_name:
        description: 'اسم المود الذي تريد بناءه'
        required: true
        default: 'MyCustomMod'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository...
      uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Setup SSH keys...
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH }}

    - name: Get GTA:SA structures file (private)...
      run: |
        git clone ssh://git@github.com/RusJJ/GTASAAndroid_Structs.git ./structs
        mkdir -p ./jni
        mv ./structs/* ./jni/
        rm -rf ./structs

    - name: Install Android NDK (r24)...
      uses: nttld/setup-ndk@v1.2.0
      with:
        ndk-version: r24
        local-cache: true

    - name: Build the code...
      run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk NDK_DEBUG=0 -j5

    
    - name: Upload the mod!
      uses: actions/upload-artifact@v4
      with:
        name: compiled-mod-${{ github.event.inputs.mod_name }}
        path: ./libs
